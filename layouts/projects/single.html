{{- define "main" -}}
<article class="post-single project-single-study">
  <header class="post-header">
    <div class="breadcrumbs-subtle">
      <a href="/projects/">&larr; Projects</a>
    </div>

    <h1 class="post-title">
      {{ .Title }}
    </h1>

    <div class="project-case-meta">
      <span class="project-case-year">{{ .Date.Format "2006" }}</span>
      {{- with .Params.tags }}
      <span class="sep">&middot;</span>
      <span class="project-case-tags">{{ delimit . " · " }}</span>
      {{- end }}
    </div>

    {{- with .Params.summary }}
    <div class="project-case-summary lead-text">
      {{ . }}
    </div>
    {{- end }}
  </header>

  <hr class="subtle-rule" />

  <div class="post-content project-case-content">
    {{- .Content }}
  </div>

  <footer class="post-footer">
    <div class="post-back-link">
      <a href="/projects/">&larr; Back to all projects</a>
    </div>
  </footer>
</article>
{{- end -}}
