{{- define "main" -}}
<div class="projects-container">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{- with .Description }}
    <p class="page-description text-secondary">{{ . }}</p>
    {{- end }}
  </header>

  <div class="projects-editorial-list">
    {{- range .Pages }}
    <article class="project-entry-row">
      <div class="project-row-left">
        <h2 class="project-heading">
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </h2>
        {{- with .Params.summary }}
        <p class="project-summary">{{ . }}</p>
        {{- end }}
        <div class="project-meta-tags">
          {{- range .Params.tags }}
          <span class="project-tag-pill">{{ . }}</span>
          {{- end }}
        </div>
      </div>
      <div class="project-row-right">
        <span class="project-date">{{ .Date.Format "2006" }}</span>
        <a href="{{ .RelPermalink }}" class="project-link-arrow">Details &rarr;</a>
      </div>
    </article>
    {{- end }}
  </div>
</div>
{{- end -}}
